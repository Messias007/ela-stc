# Caso de estudo multimodelo: familia Cessna 172, 14 V e 28 V. LINHAS DE BASE COM DADOS DO FABRICANTE.
#
# MODELO 14 V (172M 1976): Service Manual 1969-76, Change 5, "Electrical Load Analysis Chart",
#   p. 16-37/16-38 (PDF p. 285-286), coluna 1976. Alternador 14 V 60 A (16-38, PDF p. 253);
#   bateria 12 V ~25 Ah (16-15, PDF p. 246).
# MODELO 28 V (172R/172S painel convencional): Maintenance Manual 172 (1996 & on), 172RMM rev. 15,
#   24-70-00 "Electrical Load Analysis", Tables 1 e 2, coluna 28 VDC (PDF p. 394-397).
#   Bateria 24 V 12,75 Ah na taxa de 5 h (PDF p. 352; opcional 15,5 Ah, PDF p. 361), convertida para a
#   taxa de 1 h por 85 % (CASA AC 21-38 v2.1, 4.5.12.2): 12,75 × 0,85 = 10,8375 Ah. Alternador 60 A (PDF p. 397, nota I).
#   Ciclo de TX: 1 min a cada 10 min = 0,1 (nota J); COM 2 sempre em recepcao (nota K).
#
# INSTALACAO: GTN 650 + GMA 345 + GTX 345 + G5, correntes MAXIMAS da Garmin (conservador).
#   Manuais na pasta "Installation Manuals 650xi":
#   GTN 650: 190-01007-A3 Rev 4 (GTN 6XX/7XX AML STC IM), Table 1-5 (PDF p. 35); disjuntores Fig. E-4 (PDF p. 303)
#   GMA 345: 190-01878-02 Rev 6, Table 1-7; disjuntor 5 A recomendado
#   GTX 345: 190-01499-02 Rev 9, Table 1-12
#   G5:      190-01112-10 Rev 28, Table 1-4; disjuntor 5 A (3.2.1)
#   O procedimento da Garmin (GTN IM 3.7.2, nota [1] da Fig. 3-14) manda usar a corrente TIPICA;
#   aqui usamos a MAXIMA e comparamos as duas em dados_C172.md.
#
# METODO v2 (docs/revisao_fundamentacao.md): cls = continuous/intermittent (AC 43.13-1B 11-35; Cessna 1976
#   'running load'); current_batt_a = coluna 24 V do 172RMM para a emergencia (CASA AC 21-38 v2.1 4.4.3.11).
# PREMISSAS (declarar no artigo; analise de sensibilidade): composicao do painel, ciclos de trabalho
#   por fase, voo noturno como pior caso, cargas mantidas apos load shed, Peukert n, SOH, fator de temperatura.

aml:
  - model: "Cessna 172M 1976 (14 V)"
    tcds: "FAA 3A12"
    cert_basis: "CAR 3 (confirmar no TCDS 3A12)"
    voltage: 14
    battery_v: 12
    alternator_a: 60
    source: "Service Manual 1969-76: 16-38 (alternador), 16-15 (bateria), 16-37/38 (ELA)"
    battery: {capacity_ah: 22.0, chemistry: lead-acid, peukert_n: 1.2, soh: 0.8, soc: 0.9, temp_factor: 1.0, capacity_scenarios: true}  # Concorde RG-25, 22 Ah C1 (IEC 60952-1); reposicao listada para 172 A-M/N; Cessna original ~25 Ah sem taxa (SM 16-15)
    buses: [{name: main}, {name: avionics}]
    required_endurance_min: 30
    baseline_loads:
      - {name: battery contactor, bus: main, current_a: 0.6, duty: {ground: 1, taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "SM 16-37"}
      - {name: fuel indicators, bus: main, current_a: 0.4, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "SM 16-37"}
      - {name: flashing beacon, bus: main, current_a: 7.0, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1}, source: "SM 16-37"}
      - {name: instrument lights, bus: main, current_a: 1.3, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "SM 16-37 (noite)"}
      - {name: position lights, bus: main, current_a: 5.6, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "SM 16-37 (noite)"}
      - {name: turn coordinator, bus: main, current_a: 0.8, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "SM 16-37"}
      - {name: flap position indicator, bus: main, current_a: 0.1, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "SM 16-37"}
      - {name: strobe lights, bus: main, current_a: 4.0, duty: {takeoff_climb: 1, cruise: 1, landing: 1}, source: "SM 16-37"}
      - {name: nav/com 1 RT-328T, bus: avionics, current_a: 1.5, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "SM 16-37", radio: com1}
      - {name: COM 1 legado TX, bus: avionics, current_a: 6.0, duty: {taxi: 0.1, takeoff_climb: 0.1, cruise: 0.1, landing: 0.1, emergency: 0.1}, source: "TX nao consta da tabela 1976; valor e duty do 172RMM 24-70-00 nota J (KX 155A)", cls: intermittent, radio: com1}
      - {name: nav/com 2 RT-308C, bus: avionics, current_a: 1.5, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1}, source: "SM 16-37"}
      - {name: transponder RT-359A, bus: avionics, current_a: 1.0, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "SM 16-37"}
      - {name: encoding altimeter EA-401A, bus: avionics, current_a: 0.065, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "SM 16-37"}
      - {name: ADF R-546E, bus: avionics, current_a: 1.0, duty: {takeoff_climb: 1, cruise: 1, landing: 1}, source: "SM 16-37"}
      - {name: glideslope R-443B, bus: avionics, current_a: 0.4, duty: {landing: 1}, source: "SM 16-37"}
      - {name: marker beacon R-402A, bus: avionics, current_a: 0.3, duty: {landing: 1}, source: "SM 16-37"}
      - {name: autopilot AF-295B, bus: avionics, current_a: 2.0, duty: {cruise: 1}, source: "SM 16-37"}
      - {name: flap motor, bus: main, current_a: 15.0, breaker_a: 15, duty: {takeoff_climb: 0.05, landing: 0.1, emergency: 0.02}, source: "SM 16-38; duty assumido", cls: intermittent}
      - {name: landing and taxi light, bus: main, current_a: 20.0, duty: {taxi: 0.5, takeoff_climb: 1, landing: 1}, source: "SM 16-38; duty assumido", cls: intermittent}
      - {name: courtesy and dome lights, bus: main, current_a: 2.5, duty: {ground: 1}, source: "SM 16-38", cls: intermittent}
      - {name: map light, bus: main, current_a: 0.33, duty: {cruise: 0.3, landing: 0.3}, source: "SM 16-38; duty assumido", cls: intermittent}

  - model: "Cessna 172R/S convencional (28 V)"
