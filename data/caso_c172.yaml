    battery: {capacity_ah: 10.8375, chemistry: lead-acid, peukert_n: 1.2, soh: 0.8, soc: 0.9, temp_factor: 1.0}
    buses: [{name: main}, {name: avionics}, {name: essential, essential: true}]
    required_endurance_min: 30
    baseline_loads:
      # Table 1 (todos os avioes), coluna 28 VDC
      - {name: landing light 4596, bus: main, current_a: 8.93, duty: {takeoff_climb: 1, landing: 1}, source: "172RMM 24-70-00 T1", cls: intermittent, current_batt_a: 7.65}
