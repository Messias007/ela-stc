installation:
  name: "GTN 650 + GMA 345 + GTX 345 + G5 (substitui nav/com 1, audio, transponder e encoder)"
  removed: []
  # Cada modelo do AML troca equipamentos legados diferentes: remocoes por modelo.
  removed_by_model:
    "Cessna 172M 1976 (14 V)": [nav/com 1 RT-328T, COM 1 legado TX, transponder RT-359A, encoding altimeter EA-401A]
    "Cessna 172R/S convencional (28 V)": [nav/com 1 KX 155A RX, nav/com 1 KX 155A TX, transponder KT 76, altitude encoder SSD120, GPS KLN 94, audio panel KMA 26]
  added:
    # GTN 650: main e NAV no mesmo disjuntor (Fig. E-4): somados. Tipico 14 V: 1.6+0.60; 28 V: 0.8+0.30
    - {name: GTN 650 main + NAV, bus: avionics, current_by_v: {14: 3.96, 28: 2.08}, breaker_by_v: {14: 7.5, 28: 5}, typical_by_v: {14: 2.20, 28: 1.10}, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "Garmin 190-01007-A3 Rev 4, Table 1-5 (max 2.8+1.16 / 1.5+0.58); Fig. E-4"}
    - {name: GTN 650 COM RX, bus: avionics, current_by_v: {14: 0.45, 28: 0.21}, breaker_by_v: {14: 10, 28: 5}, typical_by_v: {14: 0.45, 28: 0.21}, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "Garmin 190-01007-A3 Rev 4, Table 1-5 (tipico); Fig. E-4", radio: gtn_com, circuit: GTN COM}
    - {name: GTN 650 COM TX, bus: avionics, current_by_v: {14: 4.02, 28: 1.76}, typical_by_v: {14: 4.02, 28: 1.76}, duty: {taxi: 0.1, takeoff_climb: 0.1, cruise: 0.1, landing: 0.1, emergency: 0.1}, source: "Garmin 190-01007-A3 Rev 4, Table 1-5 (max, 10 W); duty 172RMM nota J", cls: intermittent, radio: gtn_com, circuit: GTN COM}
    - {name: GMA 345 audio panel, bus: avionics, current_by_v: {14: 1.19, 28: 0.90}, breaker_by_v: {14: 5, 28: 5}, typical_by_v: {14: 0.83, 28: 0.43}, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "Garmin 190-01878-02 Rev 6, Table 1-7 (max sem USB); disjuntor 5 A"}
    - {name: GTX 345 transponder ADS-B, bus: avionics, current_by_v: {14: 1.30, 28: 0.65}, typical_by_v: {14: 0.72, 28: 0.36}, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "Garmin 190-01499-02 Rev 9, Table 1-12 (max); disjuntor 3 A, Fig. D-1 (PDF p. 156)", breaker_by_v: {14: 3, 28: 3}}
    - {name: G5 indicador de atitude, bus: avionics, current_by_v: {14: 0.25, 28: 0.125}, breaker_by_v: {14: 5, 28: 5}, typical_by_v: {14: 0.20, 28: 0.10}, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "Garmin 190-01112-10 Rev 28, Table 1-4 (max); 3.2.1"}
