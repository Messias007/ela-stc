      - {name: wing anti-collision lights, bus: main, current_a: 1.7, duty: {takeoff_climb: 1, cruise: 1, landing: 1}, source: "172RMM 24-70-00 T1 (media)", current_batt_a: 1.98}
      - {name: beacon light, bus: main, current_a: 1.25, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1}, source: "172RMM 24-70-00 T1 (pico)", current_batt_a: 1.07}
      - {name: under wing courtesy lights, bus: main, current_a: 1.14, duty: {ground: 1}, source: "172RMM 24-70-00 T1", cls: intermittent, current_batt_a: 0.98}
      - {name: map light, bus: main, current_a: 0.09, duty: {cruise: 0.3, landing: 0.3}, source: "172RMM 24-70-00 T1; duty assumido", cls: intermittent, current_batt_a: 0.08}
      - {name: instrument lights (10 x 0.02), bus: main, current_a: 0.2, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "172RMM 24-70-00 T1; quantidade assumida"}
      - {name: pedestal light, bus: main, current_a: 0.05, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1}, source: "172RMM 24-70-00 T1", current_batt_a: 0.04}
      - {name: flap motor, bus: main, current_a: 2.4, duty: {takeoff_climb: 0.05, landing: 0.1, emergency: 0.02}, source: "172RMM 24-70-00 T1; duty assumido", cls: intermittent, current_batt_a: 2.06}
      - {name: pitot heat, bus: main, current_a: 3.89, duty: {cruise: 0.3}, source: "172RMM 24-70-00 T1; duty assumido", current_batt_a: 3.33}
      - {name: hourmeter, bus: main, current_a: 0.02, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1}, source: "172RMM 24-70-00 T1", current_batt_a: 0.01}
      - {name: battery relay coil, bus: main, current_a: 0.33, duty: {ground: 1, taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "172RMM 24-70-00 T1", current_batt_a: 0.29}
      - {name: alternator relay coil, bus: main, current_a: 0.33, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1}, source: "172RMM 24-70-00 T1", current_batt_a: 0.29}
      - {name: alternator field and ACU, bus: main, current_a: 1.9, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1}, source: "172RMM 24-70-00 T1, nota I (max)", current_batt_a: 1.63}
      - {name: ACU bus sense, bus: main, current_a: 0.02, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1}, source: "172RMM 24-70-00 T1", current_batt_a: 0.02}
      - {name: autopilot KAP 140 computer, bus: avionics, current_a: 0.5, duty: {cruise: 1}, source: "172RMM 24-70-00 T1", current_batt_a: 0.58}
      - {name: pitch servo and clutch, bus: avionics, current_a: 0.5, duty: {cruise: 1}, source: "172RMM 24-70-00 T1", current_batt_a: 0.58}
      - {name: pitch trim servo and clutch, bus: avionics, current_a: 0.5, duty: {cruise: 1}, source: "172RMM 24-70-00 T1", current_batt_a: 0.58}
      - {name: roll servo and clutch, bus: avionics, current_a: 0.45, duty: {cruise: 1}, source: "172RMM 24-70-00 T1", current_batt_a: 0.53}
      - {name: turn coordinator, bus: essential, current_a: 0.33, duty: {taxi: 1, takeoff_climb: 1, cruise: 1, landing: 1, emergency: 1}, source: "172RMM 24-70-00 T1", current_batt_a: 0.27}
